[package]
name = "ghita_download"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "ghitadownload"
path = "src/main.rs"

[[bin]]
name = "ghitadownload-setup"
path = "src/bin/setup.rs"


[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = "0.7"
indicatif = { version = "0.17", features = ["tokio"] }
id3 = "1.14"
regex = "1.10"
anyhow = "1.0"
colored = "2.1"
dirs = "5.0"
url = "2.5"
sanitize-filename = "0.5"
crossterm = "0.25"
