[package]
name = "ghita_download"
version = "0.0.3-beta"
edition = "2021" 

[[bin]]
name = "ghitadownload"
path = "src/main.rs"

[[bin]]
name = "ghitadownload-setup"
path = "src/bin/setup.rs"


[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = "0.7"
indicatif = { version = "0.17", features = ["tokio"] }
id3 = "1.14"
regex = "1.10"
anyhow = "1.0"
colored = "2.1"
dirs = "5.0"
url = "2.5"
sanitize-filename = "0.5"
crossterm = "0.25"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
aes-gcm = "0.10"
ctr = "0.9"
aes = "0.8"
base64 = "0.22"

[build-dependencies]
sha2 = "0.10"
